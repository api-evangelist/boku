aid: boku
name: Boku
description: >-
  Boku is a global mobile payments network that connects digital merchants to
  more than 200 local payment methods — mobile wallets, real-time account-to-account
  bank transfers, and direct carrier billing — across 70+ countries, reaching over
  7 billion payment accounts. Through its Boku Direct payment gateway API, merchants
  such as Epic Games, Google, Meta, Microsoft, Netflix, Sony, Spotify, and Tencent
  accept local payments, run subscriptions, and settle globally. Boku processes over
  $9 billion in payments annually and is publicly traded on the London Stock Exchange
  (LON:BOKU).
